<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borang Punch-in & Laporan</title>
    <style>
        /* 保持与 Admin 端一致的现代感与背景 */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* 这里换成你的背景图，或者保留渐变色 */
            background: linear-gradient(135deg, #0f172a 0%, #3b82f6 50%, #93c5fd 100%);
        }

        /* 雾面玻璃效果表单卡片 */
        .glass-card {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
        }

        h2 {
            color: #ffffff;
            text-align: center;
            margin-top: 0;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ffffff;
            font-weight: 500;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        /* 输入框半透明设计 */
        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.7);
            color: #1e293b;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus, textarea:focus {
            background: rgba(255, 255, 255, 0.95);
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
        }

        /* 按钮设计 */
        .btn-submit {
            width: 100%;
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn-submit:hover {
            background-color: #2563eb;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .btn-submit:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        /* 提示信息 */
        #statusMessage {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <h2>🕒 Punch-in Kehadiran</h2>
        
        <form id="punchInForm">
            <div class="form-group">
                <label for="nama">Nama Anda (名字):</label>
                <input type="text" id="nama" required placeholder="Cth: Ali bin Abu">
            </div>
            
            <div class="form-group">
                <label for="laporan">Laporan / Catatan (报告/备注):</label>
                <!-- 这里用户可以写今天巡视了哪里，或者发生了什么事 -->
                <textarea id="laporan" rows="4" placeholder="Tulis laporan jika ada, atau biarkan kosong..."></textarea>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">Sahkan Kehadiran</button>
        </form>

        <div id="statusMessage"></div>
    </div>

    <!-- 引入打卡逻辑模块 -->
    <script type="module" src="pengguna_borang.js"></script>

</body>
</html>
