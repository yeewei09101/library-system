<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pengurusan Jadual Tugas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-card-active {
            background: rgba(59, 130, 246, 0.2);
            border-color: rgba(59, 130, 246, 0.5);
        }
        .glass-btn {
            background: rgba(255, 255, 255, 0.1);
        }
        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .glass-btn-delete:hover {
            background: rgba(239, 68, 68, 0.2);
        }
    </style>
</head>
<body class="bg-slate-900 text-gray-100 min-h-screen p-4 md:p-8">

    <div class="max-w-5xl mx-auto space-y-6">
        
        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-white">Jadual Tugas Petugas (Firebase Cloud Sync)</h1>
                <p id="bulanSemasa" class="text-xs text-gray-400 mt-1">Memuatkan tarikh...</p>
            </div>
            <button onclick="window.location.href='admin.html'" class="glass-card glass-btn px-4 py-2 rounded-lg text-sm font-semibold cursor-pointer flex items-center gap-2">
                <span>⬅</span> Kembali
            </button>
            <div id="tarikhPilihanLabel" class="text-sm font-medium bg-blue-500/20 text-blue-300 px-4 py-2 rounded-lg border border-blue-500/30 flex items-center">
                Tarikh: Belum dipilih
            </div>
        </div>

        <!-- 1. Kalendar Grid -->
        <div id="kalendarGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3">
            <!-- Calendar generated by JS -->
        </div>

        <!-- 2. Display Container & Form Buttons -->
        <div class="grid md:grid-cols-2 gap-6">
            
            <!-- Container Utama -->
            <div class="glass-card p-5 rounded-xl space-y-4">
                <div class="flex justify-between items-center border-b border-gray-700/50 pb-3">
                    <h3 class="text-sm font-semibold text-gray-200 flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-green-400"></span>
                        Petugas Utama
                    </h3>
                    <button onclick="tambahPetugas(false)" class="text-xs bg-blue-600/40 hover:bg-blue-600/60 text-blue-200 px-3 py-1.5 rounded-lg border border-blue-500/40 transition">
                        + Tambah Utama
                    </button>
                </div>
                
                <div id="senaraiUtamaContainer" class="space-y-2.5 min-h-[120px]">
                    <p class="text-xs text-gray-500 italic">Sila pilih tarikh di atas.</p>
                </div>
            </div>

            <!-- Container Standby -->
            <div class="glass-card p-5 rounded-xl space-y-4">
                <div class="flex justify-between items-center border-b border-gray-700/50 pb-3">
                    <h3 class="text-sm font-semibold text-gray-200 flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-yellow-400"></span>
                        Petugas Standby
                    </h3>
                    <button onclick="tambahPetugas(true)" class="text-xs bg-yellow-600/40 hover:bg-yellow-600/60 text-yellow-200 px-3 py-1.5 rounded-lg border border-yellow-500/40 transition">
                        + Tambah Standby
                    </button>
                </div>

                <div id="senaraiStandbyContainer" class="space-y-2.5 min-h-[120px]">
                    <p class="text-xs text-gray-500 italic">Sila pilih tarikh di atas.</p>
                </div>
            </div>

        </div>

    </div>

    <!-- JavaScript Engine -->
    <script type="module">
        import { insertData, queryData, updateData, deleteData } from './db-helper.js';

        const JADUAL_COLLECTION = "jadual_tugas";
        let currentSelectedDate = ""; 
        let currentSelectedDayOfWeek = null; 
        
        let dataCache = {}; 

        const namaHariBM = ["Ahad", "Isnin", "Selasa", "Rabu", "Khamis", "Jumaat", "Sabtu"];
        const namaBulanBM = ["Jan", "Feb", "Mac", "Apr", "Mei", "Jun", "Jul", "Ogo", "Sep", "Okt", "Nov", "Dis"];

        // Helper: Get Monday. If weekend (Saturday/Sunday), jump to NEXT Monday.
        function getStartMonday(d) {
            const date = new Date(d);
            const day = date.getDay();
            let diff = date.getDate();
            if (day === 0) { // Sunday
                diff += 1;
            } else if (day === 6) { // Saturday
                diff += 2;
            } else { // Monday to Friday
                diff += (1 - day); 
            }
            return new Date(date.setDate(diff));
        }

        // Helper: Get week number to alternate groups (Kumpulan 1 / Kumpulan 2)
        function getWeekNumber(d) {
            const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            date.setUTCDate(date.getUTCDate() + 4 - (date.getUTCDay() || 7));
            const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
            return Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
        }

        function janaKalendarBerterusan() {
            const grid = document.getElementById('kalendarGrid');
            if (!grid) return;
            grid.innerHTML = ''; 

            let currentDate = getStartMonday(new Date());
            let count = 0;
            const jumlahHariDipapar = 20; // 4 minggu bekerja (Isnin-Jumaat)

            const bulanLabel = document.getElementById('bulanSemasa');
            if (bulanLabel) {
                bulanLabel.innerText = `Bermula: ${currentDate.getDate()} ${namaBulanBM[currentDate.getMonth()]} ${currentDate.getFullYear()}`;
            }

            const actualTodayStr = new Date().toLocaleDateString('en-CA');

            while (count < jumlahHariDipapar) {
                const dayOfWeek = currentDate.getDay(); 
                
                // Hanya Isnin(1) hingga Jumaat(5)
                if (dayOfWeek !== 0 && dayOfWeek !== 6) { 
                    const isoDate = currentDate.toLocaleDateString('en-CA'); 
                    const dayName = namaHariBM[dayOfWeek];
                    const dayNum = currentDate.getDate();
                    const monthName = namaBulanBM[currentDate.getMonth()];
                    
                    const isToday = (isoDate === actualTodayStr);

                    const weekNum = getWeekNumber(currentDate);
                    const kumpulanTurn = (weekNum % 2 !== 0) ? 1 : 2;

                    const card = document.createElement('div');
                    card.className = `glass-card rounded-xl p-3 h-32 flex flex-col justify-between cursor-pointer transition hover:bg-white/10 date-card`;
                    card.setAttribute('data-tarikh', isoDate);
                    card.setAttribute('data-day', dayOfWeek);
                    card.setAttribute('data-kumpulan', kumpulanTurn);
                    card.onclick = () => pilihTarikh(isoDate, dayOfWeek, card);

                    card.innerHTML = `
                        <div class="flex justify-between items-start">
                            <div class="text-xl font-bold ${isToday ? 'text-blue-400' : 'text-gray-200'}">${dayNum}</div>
                            <div class="text-[10px] uppercase tracking-wider text-gray-400">${dayName}</div>
                        </div>
                        <div class="text-xs text-gray-500">${monthName}</div>
                        
                        <div class="mt-1 text-[11px] font-bold ${kumpulanTurn === 1 ? 'text-purple-400' : 'text-orange-400'}">
                            Kump ${kumpulanTurn}
                        </div>

                        <div class="mt-auto text-[10px] text-center rounded-full py-1 ${isToday ? 'bg-blue-500/20 text-blue-300 border border-blue-500/30' : 'bg-white/5 text-gray-400'}">
                            ${isToday ? 'HARI INI' : 'Pilih'}
                        </div>
                    `;
                    grid.appendChild(card);
                    count++;
                }
                currentDate.setDate(currentDate.getDate() + 1);
            }
        }

        function paparJadual(dataJadual, utamaContainer, standbyContainer) {
            utamaContainer.innerHTML = '';
            standbyContainer.innerHTML = '';
            let countUtama = 0; let countStandby = 0;

            dataJadual.forEach(item => {
                const namaPetugas = item.nama || item.id_pengguna || 'Unknown';
                const statusVal = item.status || 'Hadir';
                const isTidakHadir = statusVal.toLowerCase().includes('tidak hadir');
                const isGanti = statusVal.toLowerCase().includes('ganti');
                const isRecurring = item.is_recurring || item.day_of_week !== undefined;
                const docId = item.id;
                const jenisTugas = (item.jenis_tugas || 'utama').toLowerCase();
                
                const recurringLabel = item.kumpulan ? `Kump ${item.kumpulan}` : 'Mingguan';

                const cardHTML = `
                    <div class="glass-card rounded-lg p-3 flex justify-between items-center ${isTidakHadir ? 'border-red-500/30 bg-red-900/20' : ''} ${isGanti ? 'border-blue-500/50 bg-blue-900/20 shadow-[0_0_10px_rgba(59,130,246,0.2)]' : ''}">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full ${isGanti ? 'bg-blue-600' : 'bg-gray-600'} flex items-center justify-center font-bold text-white">${namaPetugas.charAt(0).toUpperCase()}</div>
                            <div>
                                <div class="flex items-center gap-2">
                                    <p class="text-sm ${isTidakHadir ? 'text-gray-400 line-through' : 'text-gray-100'}">${namaPetugas}</p>
                                    ${isRecurring ? `<span class="text-[9px] bg-purple-500/30 text-purple-300 border border-purple-500/40 px-1.5 py-0.5 rounded">${recurringLabel}</span>` : ''}
                                </div>
                                <p class="text-[10px] ${isTidakHadir ? 'text-red-400' : (isGanti ? 'text-blue-300' : 'text-green-400')}">${statusVal}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-1">
                            <button onclick="kemaskiniPetugas('${docId}', '${namaPetugas}', '${statusVal}')" class="glass-card glass-btn px-3 py-1 text-[11px] rounded cursor-pointer">Tukar</button>
                            <button onclick="padamPetugas('${docId}', '${namaPetugas}')" class="glass-card glass-btn-delete px-3 py-1 text-[11px] rounded cursor-pointer text-red-400 border-red-500/30">Padam</button>
                        </div>
                    </div>
                `;

                if (jenisTugas === 'standby') {
                    standbyContainer.innerHTML += cardHTML;
                    countStandby++;
                } else {
                    utamaContainer.innerHTML += cardHTML;
                    countUtama++;
                }
            });

            if (countUtama === 0) utamaContainer.innerHTML = '<p class="text-xs text-gray-500 italic">Tiada petugas utama.</p>';
            if (countStandby === 0) standbyContainer.innerHTML = '<p class="text-xs text-gray-500 italic">Tiada petugas standby.</p>';
        }

        window.pilihTarikh = async function(tarikh, dayOfWeek, cardElement = null) {
            currentSelectedDate = tarikh;
            currentSelectedDayOfWeek = Number(dayOfWeek); 
            
            const weekNum = getWeekNumber(new Date(tarikh));
            const kumpulanSemasa = (weekNum % 2 !== 0) ? 1 : 2;

            const dayName = namaHariBM[currentSelectedDayOfWeek];
            const tarikhLabel = document.getElementById('tarikhPilihanLabel');
            if (tarikhLabel) {
                const badgeColor = kumpulanSemasa === 1 ? 'bg-purple-500/30 text-purple-200 border-purple-500/50' : 'bg-orange-500/30 text-orange-200 border-orange-500/50';
                tarikhLabel.innerHTML = `Tarikh: ${tarikh} (${dayName}) <span class="ml-3 px-2 py-0.5 rounded border text-[11px] ${badgeColor}">Kumpulan ${kumpulanSemasa}</span>`;
            }
            
            document.querySelectorAll('.date-card').forEach(c => c.classList.remove('glass-card-active'));
            if (cardElement) {
                cardElement.classList.add('glass-card-active');
            } else {
                const targetCard = document.querySelector(`.date-card[data-tarikh="${tarikh}"]`);
                if (targetCard) targetCard.classList.add('glass-card-active');
            }
            
            const utamaContainer = document.getElementById('senaraiUtamaContainer');
            const standbyContainer = document.getElementById('senaraiStandbyContainer');
            const cacheKey = `${tarikh}_${dayOfWeek}_${kumpulanSemasa}`;

            if (dataCache[cacheKey]) {
                paparJadual(dataCache[cacheKey], utamaContainer, standbyContainer);
            } else {
                utamaContainer.innerHTML = '<p class="text-xs text-gray-400 animate-pulse">Memuatkan data...</p>';
                standbyContainer.innerHTML = '<p class="text-xs text-gray-400 animate-pulse">Memuatkan data...</p>';
            }

            try {
                const [dataTarikh, dataHariNum, dataHariStr] = await Promise.all([
                    queryData(JADUAL_COLLECTION, 'tarikh', '==', tarikh),
                    queryData(JADUAL_COLLECTION, 'day_of_week', '==', currentSelectedDayOfWeek),
                    queryData(JADUAL_COLLECTION, 'day_of_week', '==', String(currentSelectedDayOfWeek))
                ]);

                const mapJadual = new Map();
                
                [...dataHariNum, ...dataHariStr].forEach(item => {
                    if (item && item.id) {
                        if (!item.kumpulan || Number(item.kumpulan) === kumpulanSemasa) {
                            mapJadual.set(item.id, item);
                        }
                    }
                });

                dataTarikh.forEach(item => {
                    if (item && item.id) {
                        mapJadual.set(item.id, item);
                    }
                });

                const dataJadual = Array.from(mapJadual.values());
                dataCache[cacheKey] = dataJadual;
                paparJadual(dataJadual, utamaContainer, standbyContainer);

            } catch (error) {
                console.error("Gagal dapatkan data Firebase:", error);
            }
        };

        window.tambahPetugas = async function(isStandby) {
            if (!currentSelectedDate) return alert('Sila pilih tarikh pada kalendar terlebih dahulu!');
            
            const weekNum = getWeekNumber(new Date(currentSelectedDate));
            const kumpulanSemasa = (weekNum % 2 !== 0) ? 1 : 2;

            const roleName = isStandby ? "Standby" : "Utama";
            const dayName = namaHariBM[currentSelectedDayOfWeek];
            
            const namaPetugas = prompt(`Masukkan NAMA Petugas untuk ${roleName} (${currentSelectedDate} - ${dayName}):`);
            if (!namaPetugas || !namaPetugas.trim()) return;

            const tetapkanSetiapMinggu = confirm(`Adakah anda mahu ${namaPetugas.trim()} bertugas secara berulang?\n\n[OK] = Setiap 2 Minggu (Ikut Kumpulan ${kumpulanSemasa})\n[Cancel] = Sekali Sahaja (${currentSelectedDate})`);

            try {
                const newData = {
                    nama: namaPetugas.trim(),
                    status: isStandby ? "Sedia" : "Hadir", 
                    jenis_tugas: isStandby ? "standby" : "utama",
                    created_at: new Date().toISOString()
                };

                if (tetapkanSetiapMinggu) {
                    newData.day_of_week = currentSelectedDayOfWeek;
                    newData.is_recurring = true;
                    newData.kumpulan = kumpulanSemasa;
                } else {
                    newData.tarikh = currentSelectedDate;
                    newData.is_recurring = false;
                }

                await insertData(JADUAL_COLLECTION, newData);
                alert("Berjaya disimpan!");
                
                delete dataCache[`${currentSelectedDate}_${currentSelectedDayOfWeek}_${kumpulanSemasa}`];
                window.pilihTarikh(currentSelectedDate, currentSelectedDayOfWeek);
                
            } catch (error) {
                alert("Gagal menyimpan: " + error.message);
            }
        };

        window.padamPetugas = async function(docId, nama) {
            const sah = confirm(`Padam ${nama} dari jadual Firebase ini?`);
            if (!sah) return;

            try {
                await deleteData(JADUAL_COLLECTION, docId);
                const weekNum = getWeekNumber(new Date(currentSelectedDate));
                const kumpulanSemasa = (weekNum % 2 !== 0) ? 1 : 2;

                delete dataCache[`${currentSelectedDate}_${currentSelectedDayOfWeek}_${kumpulanSemasa}`];
                window.pilihTarikh(currentSelectedDate, currentSelectedDayOfWeek);
            } catch (error) {
                alert("Gagal memadam: " + error.message);
            }
        };

        window.kemaskiniPetugas = async function(docId, namaSemasa, statusSemasa) {
            const namaBaru = prompt("Kemaskini NAMA petugas:", namaSemasa);
            if (namaBaru === null) return;
            const statusBaru = prompt("Kemaskini STATUS petugas:\n(Contoh: 'Hadir', 'Tidak Hadir', 'Ganti Ali')", statusSemasa);
            if (statusBaru === null) return;

            const updateObj = {};
            if (namaBaru.trim() !== "" && namaBaru.trim() !== namaSemasa) updateObj.nama = namaBaru.trim();
            if (statusBaru.trim() !== "" && statusBaru.trim() !== statusSemasa) updateObj.status = statusBaru.trim();

            if (Object.keys(updateObj).length === 0) return;

            try {
                await updateData(JADUAL_COLLECTION, docId, updateObj);
                const weekNum = getWeekNumber(new Date(currentSelectedDate));
                const kumpulanSemasa = (weekNum % 2 !== 0) ? 1 : 2;

                delete dataCache[`${currentSelectedDate}_${currentSelectedDayOfWeek}_${kumpulanSemasa}`];
                window.pilihTarikh(currentSelectedDate, currentSelectedDayOfWeek);
            } catch (error) {
                alert("Gagal kemaskini: " + error.message);
            }
        };

        window.muatTurunJadualHariIni = function() {
            let targetCard = document.querySelector('.date-card:has(div:contains("HARI INI"))') || document.querySelector('.date-card');
            if (targetCard) {
                const dateVal = targetCard.getAttribute('data-tarikh');
                const dayOfWeek = parseInt(targetCard.getAttribute('data-day'), 10);
                window.pilihTarikh(dateVal, dayOfWeek, targetCard);
            }
        };

        jQueryLikeContainsSetup();
        function jQueryLikeContainsSetup() {
            if (!HTMLElement.prototype.containsText) {
                HTMLElement.prototype.containsText = function(text) {
                    return this.innerText.indexOf(text) !== -1;
                };
            }
        }

        window.onload = () => {
            janaKalendarBerterusan();
            const actualTodayStr = new Date().toLocaleDateString('en-CA');
            const targetCard = document.querySelector(`.date-card[data-tarikh="${actualTodayStr}"]`) || document.querySelector('.date-card');
            if (targetCard) {
                window.pilihTarikh(targetCard.getAttribute('data-tarikh'), parseInt(targetCard.getAttribute('data-day'), 10), targetCard);
            }
        };
    </script>
</body>
</html>
