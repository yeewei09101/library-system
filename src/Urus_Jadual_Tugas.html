<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadual Bertugas - Glassmorphism</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-1px);
        }
        .glass-btn-delete:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.5);
            color: #fca5a5;
        }
        .glass-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.3);
        }
        .glass-card-active {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="bg-gray-900 min-h-screen text-white font-sans p-6 bg-gradient-to-br from-gray-900 via-blue-900/40 to-red-900/30">

    <script>
        const currentUser = JSON.parse(sessionStorage.getItem("user"));
        if (!currentUser || currentUser.role !== "admin") {
            alert("Akses dilarang! Halaman ini khas untuk Pentadbir (Admin) sahaja.");
            window.location.href = "login.html";
        }
    </script>

    <div class="max-w-7xl mx-auto flex flex-col lg:flex-row gap-6">
        
        <!-- 左侧：日历区域 -->
        <div class="glass-panel rounded-2xl p-6 flex-grow lg:w-2/3">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                <div class="flex items-center gap-4">
                    <button onclick="window.location.href='admin.html'" class="glass-card glass-btn px-4 py-2 rounded-lg text-sm font-semibold cursor-pointer flex items-center gap-2">
                        <span>⬅</span> Kembali
                    </button>
                    <h1 class="text-3xl font-bold tracking-wider">Jadual Bertugas</h1>
                </div>
                <div class="space-x-3">
                    <button onclick="muatTurunJadualHariIni()" class="glass-card glass-btn px-4 py-2 rounded-lg text-sm cursor-pointer">Hari Ini</button>
                </div>
            </div>
            
            <h2 class="text-xl mb-4 text-gray-300" id="bulanSemasa">Oktober 2026</h2>

            <!-- 日历表头 -->
            <div class="grid grid-cols-7 gap-3 mb-3">
                <div class="text-center text-xs text-gray-400">Ahd</div>
                <div class="text-center text-xs text-gray-400">Isn</div>
                <div class="text-center text-xs text-gray-400">Sel</div>
                <div class="text-center text-xs text-gray-400">Rab</div>
                <div class="text-center text-xs text-gray-400">Kha</div>
                <div class="text-center text-xs text-gray-400">Jum</div>
                <div class="text-center text-xs text-gray-400">Sab</div>
            </div>

            <!-- 动态日历卡片 (示例日期) -->
            <div class="grid grid-cols-7 gap-3" id="kalendarGrid">
                <!-- 我们放几个示范按钮让你可以点击测试数据库 -->
                <div class="glass-card rounded-xl p-2 h-28 flex flex-col justify-between cursor-pointer hover:bg-white/10" onclick="pilihTarikh('2026-10-12')">
                    <div class="text-sm font-semibold">12</div>
                    <div class="text-xs text-blue-300">Klik utk urus</div>
                </div>
                <div class="glass-card rounded-xl p-2 h-28 flex flex-col justify-between cursor-pointer hover:bg-white/10" onclick="pilihTarikh('2026-10-13')">
                    <div class="text-sm font-semibold">13</div>
                    <div class="text-xs text-blue-300">Klik utk urus</div>
                </div>
                <div class="glass-card rounded-xl p-2 h-28 flex flex-col justify-between cursor-pointer hover:bg-white/10" onclick="pilihTarikh('2026-10-14')">
                    <div class="text-sm font-semibold">14</div>
                    <div class="text-xs text-blue-300">Klik utk urus</div>
                </div>
            </div>
        </div>

        <!-- 右侧：详情面板 -->
        <div class="glass-panel rounded-2xl p-6 lg:w-1/3 flex flex-col">
            <div class="flex justify-between items-center mb-6 border-b border-white/10 pb-4">
                <span class="text-sm text-gray-300 font-bold" id="tarikhPilihanLabel">Pilih Tarikh...</span>
                <span class="bg-green-500/20 border border-green-500/50 text-green-400 text-xs px-2 py-1 rounded flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-green-500"></span> Admin
                </span>
            </div>

            <div class="mb-6">
                <h3 class="text-xs text-gray-400 font-semibold mb-3 tracking-wider">SENARAI UTAMA</h3>
                <div class="space-y-3" id="senaraiUtamaContainer">
                    <p class="text-xs text-gray-500 italic">Sila klik tarikh pada kalendar terlebih dahulu.</p>
                </div>
            </div>

            <div class="mb-6">
                <h3 class="text-xs text-gray-400 font-semibold mb-3 tracking-wider">SENARAI STANDBY</h3>
                <div class="space-y-3" id="senaraiStandbyContainer">
                    <p class="text-xs text-gray-500 italic">-</p>
                </div>
            </div>

            <div class="mt-auto space-y-3">
                <button onclick="tambahPetugas(false)" class="w-full glass-card glass-btn py-3 rounded-lg text-sm transition flex justify-center items-center gap-2 cursor-pointer">
                    <span>+</span> Tambah Petugas (Utama)
                </button>
                <button onclick="tambahPetugas(true)" class="w-full glass-card glass-btn py-3 rounded-lg text-sm transition flex justify-center items-center gap-2 cursor-pointer">
                    <span>+</span> Tambah Standby
                </button>
            </div>
        </div>
    </div>

    <!-- 🌟 与 db-helper.js 真实连接的逻辑 🌟 -->
    <script type="module">
        // 导入您的真实数据库函数
        import { insertData, queryData, updateData, deleteData } from './db-helper.js';

        const JADUAL_COLLECTION = "jadual_tugas";
        let currentSelectedDate = ""; 

        /** 
         * 1. 真实获取指定日期的排班数据并动态渲染
         */
        window.pilihTarikh = async function(tarikh) {
            currentSelectedDate = tarikh;
            document.getElementById('tarikhPilihanLabel').innerText = `Tarikh: ${tarikh}`;
            
            const utamaContainer = document.getElementById('senaraiUtamaContainer');
            const standbyContainer = document.getElementById('senaraiStandbyContainer');
            
            utamaContainer.innerHTML = '<p class="text-xs text-gray-400">Memuatkan data...</p>';
            standbyContainer.innerHTML = '<p class="text-xs text-gray-400">Memuatkan data...</p>';

            try {
                // 使用 queryData 查询 firebase 中 tarikh == 选定日期 的数据
                const dataJadual = await queryData(JADUAL_COLLECTION, 'tarikh', '==', tarikh);
                
                utamaContainer.innerHTML = '';
                standbyContainer.innerHTML = '';
                let countUtama = 0; let countStandby = 0;

                dataJadual.forEach(item => {
                    const namaPetugas = item.nama || item.id_pengguna || 'Unknown';
                    const statusVal = item.status || 'Hadir';
                    const isTidakHadir = statusVal.toLowerCase().includes('tidak hadir');
                    const isGanti = statusVal.toLowerCase().includes('ganti');
                    const docId = item.id;

                    const cardHTML = `
                        <div class="glass-card rounded-lg p-3 flex justify-between items-center ${isTidakHadir ? 'border-red-500/30 bg-red-900/20' : ''} ${isGanti ? 'border-blue-500/50 bg-blue-900/20 shadow-[0_0_10px_rgba(59,130,246,0.2)]' : ''}">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 rounded-full ${isGanti ? 'bg-blue-600' : 'bg-gray-600'} flex items-center justify-center font-bold text-white">${namaPetugas.charAt(0).toUpperCase()}</div>
                                <div>
                                    <p class="text-sm ${isTidakHadir ? 'text-gray-400 line-through' : 'text-gray-100'}">${namaPetugas}</p>
                                    <p class="text-[10px] ${isTidakHadir ? 'text-red-400' : (isGanti ? 'text-blue-300' : 'text-green-400')}">${statusVal}</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-1">
                                <button onclick="tukarStatusPetugas('${docId}')" class="glass-card glass-btn px-3 py-1 text-[11px] rounded cursor-pointer">Tukar</button>
                                <button onclick="padamPetugas('${docId}', '${namaPetugas}')" class="glass-card glass-btn-delete px-3 py-1 text-[11px] rounded cursor-pointer text-red-400 border-red-500/30">Padam</button>
                            </div>
                        </div>
                    `;

                    if (item.jenis_tugas === 'utama') {
                        utamaContainer.innerHTML += cardHTML;
                        countUtama++;
                    } else if (item.jenis_tugas === 'standby') {
                        standbyContainer.innerHTML += cardHTML;
                        countStandby++;
                    }
                });

                if (countUtama === 0) utamaContainer.innerHTML = '<p class="text-xs text-gray-500 italic">Tiada petugas utama.</p>';
                if (countStandby === 0) standbyContainer.innerHTML = '<p class="text-xs text-gray-500 italic">Tiada petugas standby.</p>';

            } catch (error) {
                console.error("Gagal dapatkan data db:", error);
                utamaContainer.innerHTML = '<p class="text-xs text-red-400">Ralat sambungan database.</p>';
            }
        };

        /**
         * 2. 真实插入数据到 Firebase
         */
        window.tambahPetugas = async function(isStandby) {
            if(!currentSelectedDate) return alert('Sila pilih tarikh pada kalendar terlebih dahulu!');
            
            const roleName = isStandby ? "Standby" : "Utama";
            const namaPetugas = prompt(`Masukkan NAMA Petugas untuk ${roleName} (Tarikh: ${currentSelectedDate}):`);
            
            if (!namaPetugas) return;

            try {
                const newData = {
                    tarikh: currentSelectedDate,
                    nama: namaPetugas,
                    status: isStandby ? "Sedia" : "Hadir", 
                    jenis_tugas: isStandby ? "standby" : "utama"
                };

                // 调用真实数据库插入
                await insertData(JADUAL_COLLECTION, newData);
                
                // 刷新界面
                window.pilihTarikh(currentSelectedDate);
                
            } catch (error) {
                console.error(error);
                alert("Gagal menyimpan data.");
            }
        };

        /**
         * 3. 真实删除 Firebase 记录
         */
        window.padamPetugas = async function(docId, nama) {
            const sah = confirm(`Padam ${nama} dari jadual tarikh ini?`);
            if (!sah) return;

            try {
                // 调用真实数据库删除
                await deleteData(JADUAL_COLLECTION, docId);
                
                // 刷新界面
                window.pilihTarikh(currentSelectedDate);
                
            } catch (error) {
                console.error(error);
                alert("Gagal memadam data.");
            }
        };

        /**
         * 4. 真实更新 Firebase 状态记录
         */
        window.tukarStatusPetugas = async function(docId) {
            const statusBaru = prompt("Masukkan status baru:\n(Contoh: 'Tidak Hadir', 'Hadir', 'Ganti Ali')");
            
            if (!statusBaru) return;

            try {
                // 调用真实数据库更新
                await updateData(JADUAL_COLLECTION, docId, { status: statusBaru });
                
                // 刷新界面
                window.pilihTarikh(currentSelectedDate);
                
            } catch (error) {
                console.error(error);
                alert("Gagal kemaskini status.");
            }
        };

        /**
         * 5. 跳转至今日 (根据用户所在时区 自动获取 yyyy-mm-dd)
         */
        window.muatTurunJadualHariIni = function() {
            // 这里使用大马时间为准获取今天日期 (根据您所处的区域)
            const today = new Date().toLocaleDateString('en-CA'); // en-CA gives YYYY-MM-DD
            window.pilihTarikh(today);
        };

        // 页面打开时，默认加载“今天”的排班
        window.onload = () => {
            window.muatTurunJadualHariIni();
        };
    </script>
</body>
</html>
