<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadual Bertugas - Glassmorphism</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 自定义毛玻璃核心类 */
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        /* 增加按钮的悬停亮起效果 */
        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-1px);
        }

        .glass-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* 选中/高亮的日期卡片 */
        .glass-card-active {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<!-- 页面背景：深色渐变微光 -->
<body class="bg-gray-900 min-h-screen text-white font-sans p-6 bg-gradient-to-br from-gray-900 via-blue-900/40 to-red-900/30">

    <div class="max-w-7xl mx-auto flex flex-col lg:flex-row gap-6">
        
        <!-- 左侧：主日历区域 (70%) -->
        <div class="glass-panel rounded-2xl p-6 flex-grow lg:w-2/3">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                
                <!-- 🌟 修改部分：加入返回 Admin 按钮与标题组合 🌟 -->
                <div class="flex items-center gap-4">
                    <button onclick="window.location.href='admin.html'" class="glass-card glass-btn px-4 py-2 rounded-lg text-sm font-semibold cursor-pointer flex items-center gap-2">
                        <span>⬅</span> Kembali
                    </button>
                    <h1 class="text-3xl font-bold tracking-wider">Jadual Bertugas</h1>
                </div>

                <div class="space-x-3">
                    <button onclick="alert('Kembali ke Hari Ini')" class="glass-card glass-btn px-4 py-2 rounded-lg text-sm cursor-pointer">Hari Ini</button>
                    <button onclick="alert('Buka panel Filter')" class="glass-card glass-btn px-4 py-2 rounded-lg text-sm cursor-pointer">Filter</button>
                </div>
            </div>
            <h2 class="text-xl mb-4 text-gray-300">Oktober 2026</h2>

            <!-- 日历网格 (7列) -->
            <div class="grid grid-cols-7 gap-3">
                <!-- 星期表头 -->
                <div class="text-center text-xs text-gray-400">Ahd</div>
                <div class="text-center text-xs text-gray-400">Isn</div>
                <div class="text-center text-xs text-gray-400">Sel</div>
                <div class="text-center text-xs text-gray-400">Rab</div>
                <div class="text-center text-xs text-gray-400">Kha</div>
                <div class="text-center text-xs text-gray-400">Jum</div>
                <div class="text-center text-xs text-gray-400">Sab</div>

                <!-- 模拟日期卡片 - 空白 -->
                <div class="h-28 rounded-xl"></div>
                <div class="h-28 rounded-xl"></div>
                
                <!-- 模拟日期卡片 - 正常情况 -->
                <div class="glass-card rounded-xl p-2 h-28 flex flex-col justify-between cursor-pointer" onclick="alert('Papar butiran 1 Okt')">
                    <div class="text-sm font-semibold">1</div>
                    <div class="flex items-center space-x-2">
                        <div class="w-5 h-5 rounded-full bg-gray-500 text-[10px] flex items-center justify-center">A</div>
                        <span class="text-xs">Abu... +2</span>
                    </div>
                    <div class="mt-2 bg-yellow-500/20 border border-yellow-500/30 text-yellow-300 text-[10px] px-2 py-0.5 rounded-full text-center">
                        Standby: 2 Orang
                    </div>
                </div>

                <!-- 模拟日期卡片 - 发生替代 (高亮选中) -->
                <div class="glass-card glass-card-active rounded-xl p-2 h-28 flex flex-col justify-between cursor-pointer relative overflow-hidden" onclick="alert('Papar butiran 12 Okt')">
                    <div class="text-sm font-semibold">12</div>
                    <div class="flex items-center space-x-2 relative z-10">
                        <div class="w-5 h-5 rounded-full bg-red-500/50 text-[10px] flex items-center justify-center">A</div>
                        <!-- 缺席划线效果 -->
                        <span class="text-xs text-gray-400 line-through">Ali</span>
                    </div>
                    <div class="mt-2 bg-blue-500/30 border border-blue-500/50 text-blue-200 text-[10px] px-2 py-0.5 rounded-full text-center truncate">
                        Ganti: David
                    </div>
                </div>
                
                <div class="glass-card rounded-xl p-2 h-28 flex flex-col justify-between cursor-pointer" onclick="alert('Papar butiran 13 Okt')">
                    <div class="text-sm font-semibold">13</div>
                    <div class="flex items-center space-x-2">
                        <div class="w-5 h-5 rounded-full bg-gray-500 text-[10px] flex items-center justify-center">S</div>
                        <span class="text-xs">Siti... +3</span>
                    </div>
                    <div class="mt-2 bg-yellow-500/20 border border-yellow-500/30 text-yellow-300 text-[10px] px-2 py-0.5 rounded-full text-center">
                        Standby: 1 Orang
                    </div>
                </div>
            </div>
        </div>

        <!-- 右侧：详情面板 (30%) -->
        <div class="glass-panel rounded-2xl p-6 lg:w-1/3 flex flex-col">
            <div class="flex justify-between items-center mb-6 border-b border-white/10 pb-4">
                <span class="text-sm text-gray-300">Pilihan: 12 Okt 2026 (Isn)</span>
                <!-- Admin 标识 -->
                <span class="bg-green-500/20 border border-green-500/50 text-green-400 text-xs px-2 py-1 rounded flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-green-500"></span>
                    Admin
                </span>
            </div>

            <!-- 正选名单 -->
            <div class="mb-6">
                <h3 class="text-xs text-gray-400 font-semibold mb-3 tracking-wider">SENARAI UTAMA</h3>
                <div class="space-y-3">
                    <!-- 被替代的正选人员 (Ali) -->
                    <div class="glass-card rounded-lg p-3 flex justify-between items-center border-red-500/30 bg-red-900/20">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full bg-gray-600 flex items-center justify-center">A</div>
                            <div>
                                <p class="text-sm text-gray-400 line-through">Ali</p>
                                <p class="text-[10px] text-red-400">Tidak Hadir</p>
                            </div>
                        </div>
                        <button onclick="alert('Fungsi tukar status Ali')" class="glass-card glass-btn px-3 py-1 text-xs rounded cursor-pointer">Tukar</button>
                    </div>

                    <!-- 正常的正选人员 (Abu) -->
                    <div class="glass-card rounded-lg p-3 flex justify-between items-center">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full bg-gray-600 flex items-center justify-center">B</div>
                            <div>
                                <p class="text-sm">Abu</p>
                            </div>
                        </div>
                        <button onclick="alert('Fungsi tukar status Abu')" class="glass-card glass-btn px-3 py-1 text-xs rounded cursor-pointer">Tukar</button>
                    </div>
                </div>
            </div>

            <!-- 候补名单 -->
            <div class="mb-6">
                <h3 class="text-xs text-gray-400 font-semibold mb-3 tracking-wider">SENARAI STANDBY</h3>
                <div class="space-y-3">
                    <!-- 已激活的候补人员 (David) -->
                    <div class="glass-card rounded-lg p-3 flex justify-between items-center border-blue-500/50 bg-blue-900/20 shadow-[0_0_10px_rgba(59,130,246,0.2)] cursor-pointer" onclick="alert('Urus Standby David')">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center">D</div>
                            <div>
                                <p class="text-sm text-blue-100">David</p>
                                <p class="text-[10px] text-blue-400">Aktif (Ganti Ali)</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 底部添加按钮 -->
            <div class="mt-auto space-y-3">
                <button onclick="alert('Buka Modal Tambah Petugas')" class="w-full glass-card glass-btn py-3 rounded-lg text-sm transition flex justify-center items-center gap-2 cursor-pointer">
                    <span>+</span> Tambah Petugas
                </button>
                <button onclick="alert('Buka Modal Tambah Standby')" class="w-full glass-card glass-btn py-3 rounded-lg text-sm transition flex justify-center items-center gap-2 cursor-pointer">
                    <span>+</span> Tambah Standby
                </button>
            </div>
        </div>

    </div>
</body>
</html>
