<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semak Kehadiran - Admin</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(45deg, #12c2e9, #c471ed, #f64f59);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      padding: 20px;
      color: #fff;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .header h2 {
      font-size: 26px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }

    .back-btn {
      padding: 10px 20px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 10px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .back-btn:hover {
      background: rgba(0, 0, 0, 0.4);
    }

    .filter-card {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 25px;
    }

    .filter-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .filter-group label {
      font-size: 13px;
      font-weight: 500;
    }

    .filter-control {
      width: 100%;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .filter-control::placeholder {
      color: rgba(255, 255, 255, 0.7);
    }

    .filter-control option {
      background: #4a154b;
      color: #fff;
    }

    .reset-btn {
      padding: 10px 15px;
      background: rgba(255, 255, 255, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 8px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      align-self: flex-end;
    }

    .reset-btn:hover {
      background: rgba(255, 255, 255, 0.5);
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
      border-radius: 15px;
      padding: 25px;
      margin-bottom: 20px;
    }

    .card-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
      font-size: 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      padding-bottom: 10px;
    }

    .member-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 15px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .member-name {
      font-size: 16px;
      font-weight: 500;
    }

    .radio-group {
      display: flex;
      gap: 15px;
    }

    .radio-group label {
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      font-size: 14px;
    }

    .radio-group input[type="radio"] {
      accent-color: #4a154b;
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .save-btn {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      background: rgba(255, 255, 255, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 10px;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .save-btn:hover {
      background: rgba(255, 255, 255, 0.4);
    }

    /* NEW: Delete Button Styling */
    .delete-btn {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: rgba(255, 50, 50, 0.3); /* Reddish background */
      border: 1px solid rgba(255, 100, 100, 0.5);
      border-radius: 10px;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .delete-btn:hover {
      background: rgba(255, 50, 50, 0.6);
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2>Semak Kehadiran </h2>
      <a href="javascript:history.back()" class="back-btn">Kembali (Back) </a>
    </div>

    <!-- Search and Filter Panel -->
    <div class="filter-card">
      <div class="filter-title">🔍 Carian & Tapis Rekod (Search & Filter) </div>
      <div class="filter-grid">
        <div class="filter-group">
          <label for="searchName">Nama Ahli (Name)</label>
          <input type="text" id="searchName" class="filter-control" placeholder="Cari nama (Search name)...">
        </div>
        
        <div class="filter-group">
          <label for="filterDate">Tarikh (Date)</label>
          <input type="date" id="filterDate" class="filter-control">
        </div>

        <div class="filter-group">
          <label for="filterSesi">Sesi (Session)</label>
          <select id="filterSesi" class="filter-control">
            <option value="">Semua Sesi (All)</option>
            <option value="Sesi Pagi">Sesi Pagi (Morning)</option>
            <option value="Sesi Petang">Sesi Petang (Afternoon)</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="filterStatus">Status</label>
          <select id="filterStatus" class="filter-control">
            <option value="">Semua Status (All)</option>
            <option value="Tidak Datang">Ada Tidak Datang (Contains Absent)</option>
            <option value="Datang">Semua Datang (All Present)</option>
          </select>
        </div>

        <button type="button" id="resetFilterBtn" class="reset-btn">Reset</button>
      </div>
    </div>

    <!-- Attendance Record Container -->
    <div id="attendanceContainer">
      <div class="empty-state">Memuatkan data... (Loading data...)</div>
    </div>
  </div>

  <script type="module">
    // Make sure 'deleteData' is exported from your db-helper.js
    import { readAllData, updateData, deleteData } from './db-helper.js';

    const attendanceContainer = document.getElementById('attendanceContainer');
    
    // Filter Elements
    const searchNameInput = document.getElementById('searchName');
    const filterDateInput = document.getElementById('filterDate');
    const filterSesiSelect = document.getElementById('filterSesi');
    const filterStatusSelect = document.getElementById('filterStatus');
    const resetFilterBtn = document.getElementById('resetFilterBtn');

    let globalRecords = [];

    // Load Data from Firebase
    async function loadAttendanceData() {
      try {
        globalRecords = await readAllData('attendance');

        if (!globalRecords || globalRecords.length === 0) {
          attendanceContainer.innerHTML = '<div class="empty-state glass-card">Tiada rekod kehadiran. (No attendance record found)</div>';
          return;
        }

        renderFilteredData();

      } catch (error) {
        console.error('Error loading data:', error);
        attendanceContainer.innerHTML = '<div class="empty-state glass-card">Ralat memuatkan data. (Error loading data)</div>';
      }
    }

    // Render Data based on Filters
    function renderFilteredData() {
      const nameQuery = searchNameInput.value.trim().toLowerCase();
      const dateQuery = filterDateInput.value;
      const sesiQuery = filterSesiSelect.value;
      const statusQuery = filterStatusSelect.value;

      const filteredRecords = globalRecords.filter(record => {
        if (nameQuery) {
          const matchName = record.members && record.members.some(m => m.nama && m.nama.toLowerCase().includes(nameQuery));
          if (!matchName) return false;
        }

        if (dateQuery && record.tarikh !== dateQuery) {
          return false;
        }

        if (sesiQuery && record.sesi !== sesiQuery) {
          return false;
        }

        if (statusQuery) {
          if (!record.members) return false;
          if (statusQuery === 'Tidak Datang') {
            const hasAbsent = record.members.some(m => m.status === 'Tidak Datang');
            if (!hasAbsent) return false;
          } else if (statusQuery === 'Datang') {
            const allPresent = record.members.every(m => m.status === 'Datang' || !m.status);
            if (!allPresent) return false;
          }
        }

        return true;
      });

      if (filteredRecords.length === 0) {
        attendanceContainer.innerHTML = '<div class="empty-state glass-card">Tiada rekod padan dengan carian. (No records match the search)</div>';
        return;
      }

      attendanceContainer.innerHTML = '';

      filteredRecords.forEach((record) => {
        const recordId = record.id || record.docId;
        const card = document.createElement('div');
        card.className = 'glass-card';

        let membersHTML = '';
        
        if (Array.isArray(record.members)) {
          record.members.forEach((member, index) => {
            const memberId = member.id || (index + 1);
            const isDatang = member.status ? member.status === 'Datang' : true;
            const isTidakDatang = member.status === 'Tidak Datang';

            membersHTML += `
              <div class="member-row">
                <span class="member-name">${memberId}. ${member.nama}</span>
                <div class="radio-group">
                  <label>
                    <input type="radio" name="status_${recordId}_${memberId}" value="Datang" ${isDatang ? 'checked' : ''}>
                    <span>Datang</span>
                  </label>
                  <label>
                    <input type="radio" name="status_${recordId}_${memberId}" value="Tidak Datang" ${isTidakDatang ? 'checked' : ''}>
                    <span>Tidak Datang</span>
                  </label>
                </div>
              </div>
            `;
          });
        }

        card.innerHTML = `
          <div class="card-info">
            <div><strong>Sesi:</strong> ${record.sesi || '-'}</div>
            <div><strong>Tarikh:</strong> ${record.tarikh || '-'} ${record.masa || ''}</div>
            <div><strong>Jumlah:</strong> ${record.jumlah_ahli || (record.members ? record.members.length : 0)} Ahli</div>
          </div>
          
          <form id="form_${recordId}">
            ${membersHTML}
            <button type="button" class="save-btn" data-record-id="${recordId}">Simpan Semakan (Save Changes)</button>
            <!-- NEW: Delete Button Added Here -->
            <button type="button" class="delete-btn" data-record-id="${recordId}">Padam Rekod (Delete Record)</button>
          </form>
        `;

        attendanceContainer.appendChild(card);
      });

      // Bind Event for Save Buttons
      document.querySelectorAll('.save-btn').forEach(button => {
        button.addEventListener('click', async (e) => {
          const recId = e.target.getAttribute('data-record-id');
          await handleSaveStatus(recId, e.target);
        });
      });

      // NEW: Bind Event for Delete Buttons
      document.querySelectorAll('.delete-btn').forEach(button => {
        button.addEventListener('click', async (e) => {
          const recId = e.target.getAttribute('data-record-id');
          await handleDeleteRecord(recId, e.target);
        });
      });
    }

    // Handle Status Update
    async function handleSaveStatus(recordId, btnElement) {
      const targetRecord = globalRecords.find(r => (r.id || r.docId) === recordId);
      if (!targetRecord || !targetRecord.members) return;

      const updatedMembers = targetRecord.members.map((member, index) => {
        const memberId = member.id || (index + 1);
        const selectedRadio = document.querySelector(`input[name="status_${recordId}_${memberId}"]:checked`);
        return {
          ...member,
          status: selectedRadio ? selectedRadio.value : (member.status || 'Datang')
        };
      });

      btnElement.disabled = true;
      btnElement.textContent = 'Menyimpan... (Saving...)';

      try {
        await updateData('attendance', recordId, {
          members: updatedMembers
        });
        
        targetRecord.members = updatedMembers;
        alert('Kehadiran berjaya dikemas kini! (Attendance successfully updated!)');
      } catch (error) {
        console.error('Save status failed:', error);
        alert('Ralat semasa menyimpan. Sila cuba lagi. (Error saving. Please try again.)');
      } finally {
        btnElement.disabled = false;
        btnElement.textContent = 'Simpan Semakan (Save Changes)';
      }
    }

    // NEW: Handle Delete Record Logic
    async function handleDeleteRecord(recordId, btnElement) {
      // Prompt user for confirmation before deleting
      const confirmDelete = confirm('Adakah anda pasti mahu memadam rekod ini secara kekal? (Are you sure you want to permanently delete this record?)');
      if (!confirmDelete) return;

      btnElement.disabled = true;
      btnElement.textContent = 'Memadam... (Deleting...)';

      try {
        // Call the deleteData function to delete from Firebase
        await deleteData('attendance', recordId);
        
        // Remove the deleted record from the local globalRecords array
        globalRecords = globalRecords.filter(r => (r.id || r.docId) !== recordId);

        alert('Rekod berjaya dipadam! (Record successfully deleted!)');
        
        // Re-render the UI without the deleted record
        renderFilteredData();
      } catch (error) {
        console.error('Delete failed:', error);
        alert('Ralat semasa memadam. Sila cuba lagi. (Error deleting. Please try again.)');
        btnElement.disabled = false;
        btnElement.textContent = 'Padam Rekod (Delete Record)';
      }
    }

    // Bind Filter Events
    searchNameInput.addEventListener('input', renderFilteredData);
    filterDateInput.addEventListener('change', renderFilteredData);
    filterSesiSelect.addEventListener('change', renderFilteredData);
    filterStatusSelect.addEventListener('change', renderFilteredData);

    // Reset Button Logic
    resetFilterBtn.addEventListener('click', () => {
      searchNameInput.value = '';
      filterDateInput.value = '';
      filterSesiSelect.value = '';
      filterStatusSelect.value = '';
      renderFilteredData();
    });

    loadAttendanceData();
  </script>
</body>
</html>
