<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Semak Kehadiran</title>
  <style>
    /* Base CSS Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Dynamic animated gradient background */
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(45deg, #12c2e9, #c471ed, #f64f59);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      padding: 20px;
      color: #fff;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Glassmorphism container - wider than submission form to fit the table */
    .glass-container {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 900px;
      overflow: hidden;
    }

    .glass-container h2 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 1px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }

    /* Top action controls bar */
    .controls {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .btn {
      padding: 10px 20px;
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      text-decoration: none;
    }

    .btn-refresh {
      background: rgba(255, 255, 255, 0.25);
    }

    .btn-refresh:hover {
      background: rgba(255, 255, 255, 0.4);
      transform: translateY(-2px);
    }

    .btn-back {
      background: rgba(0, 0, 0, 0.15);
    }

    .btn-back:hover {
      background: rgba(0, 0, 0, 0.25);
      transform: translateY(-2px);
    }

    /* Disabled button state handling */
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none !important;
    }

    /* Responsive table wrapper */
    .table-responsive {
      width: 100%;
      overflow-x: auto;
    }

    /* Semi-transparent table styling */
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      white-space: nowrap;
    }

    th, td {
      padding: 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }

    th {
      background: rgba(255, 255, 255, 0.1);
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    tbody tr {
      transition: background 0.3s ease;
    }

    tbody tr:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    /* Status message container */
    #statusMessage {
      text-align: center;
      margin-top: 20px;
      font-size: 16px;
    }

    /* Custom scrollbar styling */
    ::-webkit-scrollbar {
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(255,255,255,0.1); 
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.4); 
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <div class="glass-container">
    <h2>Senarai Kehadiran (打卡记录)</h2>
    
    <div class="controls">
      <button class="btn btn-back" onclick="window.history.back()">Kembali (返回)</button>
      <button class="btn btn-refresh" id="refreshBtn">Muat Semula (刷新)</button>
    </div>

    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>Bil.</th>
            <th>Nama Lengkap (姓名)</th>
            <th>Sesi (时段)</th>
            <th>Tarikh (日期)</th>
            <th>Masa (时间)</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- Data rows will be injected dynamically via JavaScript -->
        </tbody>
      </table>
    </div>
    
    <div id="statusMessage">Sedang memuat data... (加载中)</div>
  </div>

  <!-- Using type="module" to enable ES module imports -->
  <script type="module">
    // 修复 1：改为正确的短横线文件名 db-helper.js
    import { readAllData } from './db-helper.js';

    const tableBody = document.getElementById('tableBody');
    const statusMessage = document.getElementById('statusMessage');
    const refreshBtn = document.getElementById('refreshBtn');

    // Utility function to sanitize string input against XSS
    function escapeHtml(str) {
      if (!str) return '-';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Function to fetch and display attendance records
    async function loadAttendanceData() {
      tableBody.innerHTML = '';
      statusMessage.textContent = 'Sedang memuat data... (加载中)';
      refreshBtn.disabled = true;

      try {
        // 修复 2：将集合名称从 'rekod_kehadiran' 改为与提交打卡一致的 'attendance'
        const records = await readAllData('attendance', 'createdAt', 'desc');

        if (!records || records.length === 0) {
          statusMessage.textContent = 'Tiada rekod kehadiran dijumpai. (暂无打卡记录)';
          return;
        }

        statusMessage.textContent = '';

        const fragment = document.createDocumentFragment();

        records.forEach((data, index) => {
          const tr = document.createElement('tr');
          
          tr.innerHTML = `
            <td>${index + 1}</td>
            <td>${escapeHtml(data.nama)}</td>
            <td>${escapeHtml(data.sesi)}</td>
            <td>${escapeHtml(data.tarikhFormat)}</td>
            <td>${escapeHtml(data.masaFormat)}</td>
          `;
          
          fragment.appendChild(tr);
        });

        tableBody.appendChild(fragment);

      } catch (error) {
        console.error("Error fetching data:", error);
        statusMessage.textContent = 'Gagal memuat data. Sila semak sambungan pangkalan data anda. (读取失败)';
      } finally {
        refreshBtn.disabled = false;
      }
    }

    refreshBtn.addEventListener('click', loadAttendanceData);

    loadAttendanceData();
  </script>
</body>
</html>
