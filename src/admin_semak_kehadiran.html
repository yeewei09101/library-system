<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semak Kehadiran - Admin</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(45deg, #12c2e9, #c471ed, #f64f59);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      padding: 20px;
      color: #fff;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .header h2 {
      font-size: 26px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }

    .back-btn {
      padding: 10px 20px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 10px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .back-btn:hover {
      background: rgba(0, 0, 0, 0.4);
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
      border-radius: 15px;
      padding: 25px;
      margin-bottom: 20px;
    }

    .card-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
      font-size: 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      padding-bottom: 10px;
    }

    .member-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 15px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .member-name {
      font-size: 16px;
      font-weight: 500;
    }

    .radio-group {
      display: flex;
      gap: 15px;
    }

    .radio-group label {
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      font-size: 14px;
    }

    .radio-group input[type="radio"] {
      accent-color: #4a154b;
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .save-btn {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      background: rgba(255, 255, 255, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 10px;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .save-btn:hover {
      background: rgba(255, 255, 255, 0.4);
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2>Semak Kehadiran (管理员审核)</h2>
      <a href="javascript:history.back()" class="back-btn">Kembali (返回)</a>
    </div>

    <div id="attendanceContainer">
      <div class="empty-state">Memuatkan data...</div>
    </div>
  </div>

  <script type="module">
    import { getData, updateData } from './db-helper.js';

    const attendanceContainer = document.getElementById('attendanceContainer');

    async function loadAttendanceData() {
      try {
        // 从数据库中拉取所有打卡组数据
        const records = await getData('attendance');

        if (!records || records.length === 0) {
          attendanceContainer.innerHTML = '<div class="empty-state glass-card">Tiada rekod kehadiran. (暂无打卡记录)</div>';
          return;
        }

        attendanceContainer.innerHTML = '';

        // 按时间倒序（最新的显示在最前）
        records.reverse().forEach((record) => {
          const card = document.createElement('div');
          card.className = 'glass-card';

          let membersHTML = '';
          record.members.forEach((member) => {
            membersHTML += `
              <div class="member-row">
                <span class="member-name">${member.id}. ${member.nama}</span>
                <div class="radio-group">
                  <label>
                    <input type="radio" name="status_${record.id}_${member.id}" value="Datang" ${member.status === 'Datang' ? 'checked' : ''}>
                    <span>Datang (出席)</span>
                  </label>
                  <label>
                    <input type="radio" name="status_${record.id}_${member.id}" value="Tidak Datang" ${member.status === 'Tidak Datang' ? 'checked' : ''}>
                    <span>Tidak Datang (缺席)</span>
                  </label>
                </div>
              </div>
            `;
          });

          card.innerHTML = `
            <div class="card-info">
              <div><strong>Sesi:</strong> ${record.sesi}</div>
              <div><strong>Tarikh:</strong> ${record.tarikh || '-'} ${record.masa || ''}</div>
              <div><strong>Jumlah:</strong> ${record.jumlah_ahli} Ahli</div>
            </div>
            
            <form id="form_${record.id}">
              ${membersHTML}
              <button type="button" class="save-btn" data-record-id="${record.id}">Simpan Semakan (保存审核)</button>
            </form>
          `;

          attendanceContainer.appendChild(card);
        });

        // 绑定每个卡片的保存按钮事件
        document.querySelectorAll('.save-btn').forEach(button => {
          button.addEventListener('click', async (e) => {
            const recordId = e.target.getAttribute('data-record-id');
            await handleSaveStatus(recordId, records, e.target);
          });
        });

      } catch (error) {
        console.error('Error loading data:', error);
        attendanceContainer.innerHTML = '<div class="empty-state glass-card">Ralat memuatkan data. (加载失败)</div>';
      }
    }

    async function handleSaveStatus(recordId, records, btnElement) {
      const targetRecord = records.find(r => String(r.id) === String(recordId));
      if (!targetRecord) return;

      // 提取勾选的状态并更新数据
      const updatedMembers = targetRecord.members.map(member => {
        const selectedRadio = document.querySelector(`input[name="status_${recordId}_${member.id}"]:checked`);
        return {
          ...member,
          status: selectedRadio ? selectedRadio.value : member.status
        };
      });

      btnElement.disabled = true;
      btnElement.textContent = 'Menyimpan...';

      try {
        // 调用数据库更新函数
        await updateData('attendance', recordId, {
          members: updatedMembers
        });
        alert('Kehadiran berjaya dikemas kini! (更新成功)');
      } catch (error) {
        console.error('Save status failed:', error);
        alert('Ralat semasa menyimpan. Sila cuba lagi. (保存失败)');
      } finally {
        btnElement.disabled = false;
        btnElement.textContent = 'Simpan Semakan (保存审核)';
      }
    }

    loadAttendanceData();
  </script>
</body>
</html>
