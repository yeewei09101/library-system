<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem PSS - Hantar Laporan</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { position: relative; color: #0f172a; min-height: 100vh; padding: 20px; overflow-x: hidden; }
    body::before { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('../img/bg-library.jpg') no-repeat center center/cover; filter: blur(8px) brightness(0.85); transform: scale(1.05); z-index: -1; }
    .container { max-width: 800px; margin: 0 auto; }
    .frosted-glass { background: rgba(255, 255, 255, 0.45); backdrop-filter: blur(16px) saturate(180%); -webkit-backdrop-filter: blur(16px) saturate(180%); border: 1px solid rgba(255, 255, 255, 0.6); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.15); border-radius: 16px; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; margin-bottom: 20px; }
    .header-title { font-size: 1.2rem; font-weight: 700; color: #0f172a; display: flex; align-items: center; gap: 10px; }
    .btn-back { background: rgba(15, 23, 42, 0.1); color: #0f172a; border: 1px solid rgba(15, 23, 42, 0.2); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; text-decoration: none; transition: all 0.2s; }
    .btn-back:hover { background: rgba(15, 23, 42, 0.2); }
    .laporan-card { padding: 28px; margin-bottom: 25px; }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-weight: 700; font-size: 0.95rem; margin-bottom: 10px; color: #0f172a; }
    .checkbox-grid { display: grid; grid-template-columns: 1fr; gap: 10px; background: rgba(255, 255, 255, 0.3); padding: 14px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.5); }
    .checkbox-item { display: flex; align-items: center; gap: 10px; font-size: 0.92rem; cursor: pointer; color: #1e293b; }
    .checkbox-item input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: #2563eb; }
    .laporan-textarea { width: 100%; height: 120px; padding: 12px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.6); background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(4px); font-size: 0.95rem; outline: none; resize: vertical; transition: border-color 0.2s, background 0.2s; }
    .laporan-textarea:focus { border-color: #2563eb; background: rgba(255, 255, 255, 0.9); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2); }
    .signature-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
    .meta-box { background: rgba(255, 255, 255, 0.35); padding: 12px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.5); font-size: 0.85rem; }
    .meta-box span { display: block; color: #64748b; font-size: 0.75rem; margin-bottom: 4px; text-transform: uppercase; font-weight: 700; }
    .btn-submit { background: #2563eb; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; width: 100%; transition: background 0.2s; }
    .btn-submit:hover { background: #1d4ed8; }
    .btn-submit:disabled { background: #94a3b8; cursor: not-allowed; }
    .history-section { padding: 24px; }
    .history-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 15px; color: #0f172a; }
    .history-item { background: rgba(255, 255, 255, 0.5); border-left: 4px solid #2563eb; padding: 14px 16px; border-radius: 6px; margin-bottom: 12px; }
    .history-header { display: flex; justify-content: space-between; font-size: 0.8rem; color: #475569; margin-bottom: 6px; }
    .history-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .tag { background: #dbeafe; color: #1e40af; font-size: 0.75rem; padding: 2px 8px; border-radius: 4px; font-weight: 600; }
    .history-body { font-size: 0.9rem; color: #0f172a; white-space: pre-line; margin-bottom: 8px; }
    .history-footer { display: flex; justify-content: space-between; font-size: 0.8rem; color: #64748b; border-top: 1px dashed rgba(0,0,0,0.1); padding-top: 6px; }
  </style>
</head>
<body>

  <script>
    const currentUser = JSON.parse(sessionStorage.getItem("user"));
    if (!currentUser || currentUser.role !== "user") {
      alert("Akses dilarang! Sila log masuk terlebih dahulu.");
      window.location.href = "login.html";
    }
  </script>

  <div class="container">
    <header class="frosted-glass">
      <div class="header-title">📝 Borang Hantar Laporan PSS</div>
      <a href="utama.html" class="btn-back">⬅ Kembali ke Utama</a>
    </header>

    <div class="laporan-card frosted-glass">
      <form id="formLaporan">
        <div class="form-group">
          <label class="form-label">Kategori Laporan Aktiviti (Pilih berkaitan):</label>
          <div class="checkbox-grid">
            <label class="checkbox-item"><input type="checkbox" name="katLaporan" value="Sirkulasi (Aktiviti)"><span>Sirkulasi (Aktiviti)</span></label>[cite: 1]
            <label class="checkbox-item"><input type="checkbox" name="katLaporan" value="Proses Bahan Baharu"><span>Proses Bahan Baharu</span></label>[cite: 1]
            <label class="checkbox-item"><input type="checkbox" name="katLaporan" value="Pelupusan Bahan Lama / NILAM"><span>Pelupusan Bahan Lama / NILAM</span></label>[cite: 1]
            <label class="checkbox-item"><input type="checkbox" name="katLaporan" value="Kemas Sistem / Cerita Disiplin"><span>Kemas Sistem / Cerita Disiplin</span></label>[cite: 1]
            <label class="checkbox-item"><input type="checkbox" name="katLaporan" value="Surat Pustakawan baru & kemas / Fail Tegak"><span>Surat Pustakawan baru & kemas / Fail Tegak</span></label>[cite: 1]
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="laporanInput">Isu / Masalah / Aduan:</label>[cite: 1]
          <textarea id="laporanInput" class="laporan-textarea" placeholder="Tulis butiran isu, masalah atau aduan di sini..." required></textarea>
        </div>

        <div class="signature-grid">
          <div class="meta-box">
            <span>Pelapor (Dihantar Oleh):</span>[cite: 1]
            <strong id="pelaporName">-</strong>
          </div>
          <div class="meta-box">
            <span>Penyemak (Status Semakan):</span>[cite: 1]
            <strong id="penyemakStatus" style="color: #d97706;">Belum Disemak (Pending)</strong>
          </div>
        </div>

        <button type="submit" id="btnSubmit" class="btn-submit">Hantar Laporan</button>
      </form>
    </div>

    <div class="history-section frosted-glass">
      <div class="history-title">📜 Sejarah Laporan Dihantar</div>
      <div id="historyList">Memuatkan data...</div>
    </div>
  </div>

  <!-- 引入 ES Module 版本的 Firebase 辅助函数 -->
  <script type="module">
    import { insertData, queryData } from './db-helper.js';

    const userNameDisplay = currentUser.id_pengguna || currentUser.nama || "Pengawas";
    document.getElementById("pelaporName").textContent = userNameDisplay;

    // 表单提交事件
    document.getElementById("formLaporan").addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const submitBtn = document.getElementById("btnSubmit");
      submitBtn.disabled = true;
      submitBtn.textContent = "Sedang Dihantar...";

      try {
        const now = new Date();
        const tarikhToday = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

        // 2. 表单字段收集
        const checkedCategories = Array.from(document.querySelectorAll('input[name="katLaporan"]:checked')).map(cb => cb.value);
        const isuContent = document.getElementById('laporanInput').value.trim();

        if (checkedCategories.length === 0) {
          alert("Sila pilih sekurang-kurangnya satu kategori laporan!");
          submitBtn.disabled = false;
          submitBtn.textContent = "Hantar Laporan";
          return;
        }

        const masaStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;

        // 3. 构建插入 Firebase 的数据
        const laporanData = {
          pelapor: userNameDisplay,
          kategori: checkedCategories,
          isu: isuContent,
          tarikh: tarikhToday,
          masa: masaStr,
          penyemak: "Belum Disemak",
          status: "Pending"
        };

        // 插入数据库表 'laporan'
        await insertData('laporan', laporanData);

        alert("Laporan berjaya dihantar ke sistem Firebase!");
        document.getElementById('formLaporan').reset();
        renderHistory();
      } catch (err) {
        console.error("Ralat semasa menghantar:", err);
        alert("Gagal menghantar laporan: " + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Hantar Laporan";
      }
    });

    // 读取该用户的历史提交数据
    async function renderHistory() {
      const historyList = document.getElementById('historyList');
      try {
        const myReports = await queryData('laporan', 'pelapor', '==', userNameDisplay);

        if (!myReports || myReports.length === 0) {
          historyList.innerHTML = `<p style="font-size:0.85rem; color:#64748b;">Tiada rekod laporan yang dihantar lagi.</p>`;
          return;
        }

        // 按时间倒序
        myReports.sort((a, b) => (b.createdAt?.toDate?.() || 0) - (a.createdAt?.toDate?.() || 0));

        historyList.innerHTML = myReports.map(item => `
          <div class="history-item">
            <div class="history-header">
              <span>📅 ${escapeHTML(item.tarikh)} (${escapeHTML(item.masa)})</span>
              <span style="font-weight:bold; color: ${item.status === 'Disemak' ? '#16a34a' : '#d97706'}">
                Status: ${escapeHTML(item.penyemak)}
              </span>
            </div>
            <div class="history-tags">
              ${(item.kategori || []).map(k => `<span class="tag">${escapeHTML(k)}</span>`).join('')}
            </div>
            <div class="history-body"><strong>Isu/Aduan:</strong> ${escapeHTML(item.isu)}</div>
            <div class="history-footer">
              <span>Pelapor: ${escapeHTML(item.pelapor)}</span>
            </div>
          </div>
        `).join('');
      } catch (err) {
        historyList.innerHTML = `<p style="color:red;">Gagal memuatkan sejarah: ${err.message}</p>`;
      }
    }

    function escapeHTML(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    renderHistory();
  </script>
</body>
</html>
