<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Rekod Kehadiran</title>
  <style>
    /* Base CSS Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Dynamic animated gradient background */
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(45deg, #12c2e9, #c471ed, #f64f59);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      padding: 20px;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Glassmorphism main container */
    .glass-container {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 450px;
      color: #fff;
    }

    .glass-container h2 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 1px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }

    /* Form element styles */
    .form-group {
      margin-bottom: 25px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 500;
    }

    .form-control {
      width: 100%;
      padding: 12px 15px;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 10px;
      color: #fff;
      font-size: 16px;
      outline: none;
      transition: all 0.3s ease;
    }

    .form-control::placeholder {
      color: rgba(255, 255, 255, 0.7);
    }

    .form-control:focus {
      background: rgba(255, 255, 255, 0.3);
      border-color: #fff;
      box-shadow: 0 0 10px rgba(255,255,255,0.2);
    }

    /* Dropdown options compatibility fix */
    select.form-control option {
      background: #4a154b; 
      color: #ffffff;
    }

    /* Button group layout */
    .btn-group {
      display: flex;
      gap: 15px;
      margin-top: 10px;
    }

    .btn {
      flex: 1; 
      padding: 14px;
      border-radius: 10px;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(5px);
      text-align: center;
      text-decoration: none;
    }

    .submit-btn {
      background: rgba(255, 255, 255, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .submit-btn:hover {
      background: rgba(255, 255, 255, 0.4);
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .submit-btn:disabled {
      background: rgba(255, 255, 255, 0.1);
      cursor: not-allowed;
      transform: none;
    }

    .back-btn {
      background: rgba(0, 0, 0, 0.15); 
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .back-btn:hover {
      background: rgba(0, 0, 0, 0.25);
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    #statusMessage {
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
      min-height: 20px;
    }

    /* Pop-up Modal Styles */
    .popup-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(5px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .popup-overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .popup-box {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      border-radius: 20px;
      padding: 30px;
      width: 90%;
      max-width: 350px;
      text-align: center;
      color: #fff;
      transform: translateY(-30px) scale(0.95);
      transition: all 0.3s ease;
    }

    .popup-overlay.show .popup-box {
      transform: translateY(0) scale(1);
    }

    .popup-box h3 {
      font-size: 24px;
      margin-bottom: 10px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }

    .popup-box p {
      font-size: 16px;
      margin-bottom: 25px;
      color: rgba(255, 255, 255, 0.9);
    }

    .popup-close-btn {
      padding: 10px 25px;
      background: rgba(255, 255, 255, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 10px;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .popup-close-btn:hover {
      background: rgba(255, 255, 255, 0.4);
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <!-- Main Glassmorphism Container -->
  <div class="glass-container">
    <h2>Sistem Kehadiran</h2>
    <form id="attendanceForm">
      
      <!-- Jumlah Ahli Input -->
      <div class="form-group">
        <label for="jumlahAhli">Jumlah Ahli (出席人数)</label>
        <input type="number" id="jumlahAhli" class="form-control" min="1" max="50" value="1" placeholder="Masukkan jumlah ahli" required>
      </div>

      <!-- Container for dynamically generated member name inputs -->
      <div id="membersContainer"></div>

      <div class="form-group">
        <label for="sesiWaktu">Sesi (时段)</label>
        <select id="sesiWaktu" class="form-control" required>
          <option value="" disabled selected>Pilih Sesi...</option>
          <option value="Sesi Pagi">Sesi Pagi (上午)</option>
          <option value="Sesi Petang">Sesi Petang (下午)</option>
        </select>
      </div>

      <div class="btn-group">
        <button type="button" class="btn back-btn" onclick="window.history.back()">Kembali (返回)</button>
        <button type="submit" class="btn submit-btn" id="submitBtn">Hantar (打卡)</button>
      </div>
      
      <!-- Container for displaying error/status messages -->
      <div id="statusMessage"></div>
    </form>
  </div>

  <!-- Success Pop-up Modal -->
  <div class="popup-overlay" id="successPopup">
    <div class="popup-box">
      <h3>Berjaya! 🎉</h3>
      <p>Kehadiran anda telah direkodkan.</p>
      <button class="popup-close-btn" id="closePopupBtn">Tutup (关闭)</button>
    </div>
  </div>

  <script type="module">
    import { insertData } from './db-helper.js';

    const attendanceForm = document.getElementById('attendanceForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMessage = document.getElementById('statusMessage');
    const successPopup = document.getElementById('successPopup');
    const closePopupBtn = document.getElementById('closePopupBtn');
    const jumlahAhliInput = document.getElementById('jumlahAhli');
    const membersContainer = document.getElementById('membersContainer');

    // 动态渲染姓名输入框函数
    function renderMemberInputs() {
      const count = parseInt(jumlahAhliInput.value, 10) || 1;
      membersContainer.innerHTML = '';

      for (let i = 1; i <= count; i++) {
        const group = document.createElement('div');
        group.className = 'form-group';
        group.innerHTML = `
          <label for="namaLengkap_${i}">Nama Ahli ${i} (成员 ${i} 姓名)</label>
          <input type="text" id="namaLengkap_${i}" class="form-control member-name" placeholder="Masukkan nama ahli ${i}" required>
        `;
        membersContainer.appendChild(group);
      }
    }

    // 初始化运行一次，并监听人数变化事件
    renderMemberInputs();
    jumlahAhliInput.addEventListener('input', renderMemberInputs);

    // 表单提交事件处理
    attendanceForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const sesi = document.getElementById('sesiWaktu').value;
      const nameInputs = document.querySelectorAll('.member-name');
      
      // 收集所有输入的姓名
      const namaList = Array.from(nameInputs).map(input => input.value.trim());

      if (namaList.some(nama => !nama) || !sesi) {
        statusMessage.style.color = '#ffcccb';
        statusMessage.textContent = 'Sila isi semua maklumat.';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Menyimpan...';
      statusMessage.textContent = '';

      try {
        // 遍历将每一位成员的记录写入数据库
        for (const nama of namaList) {
          await insertData('attendance', {
            nama: nama,
            sesi: sesi,
            jumlah_ahli: namaList.length
          });
        }

        successPopup.classList.add('show');
        attendanceForm.reset();
        renderMemberInputs(); // 重置为默认 1 个输入框

      } catch (error) {
        console.error('Submit Failed:', error);
        statusMessage.style.color = '#ffcccb';
        statusMessage.textContent = 'Ralat sistem. Sila cuba lagi.';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Hantar (打卡)';
      }
    });

    closePopupBtn.addEventListener('click', () => {
      successPopup.classList.remove('show');
      window.history.back();
    });

    successPopup.addEventListener('click', (e) => {
      if (e.target === successPopup) {
        successPopup.classList.remove('show');
        window.history.back();
      }
    });
  </script>
</body>
</html>
