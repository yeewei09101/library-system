<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Rekod Kehadiran</title>
  <style>
    /* 基础重置 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* 动态渐变背景，突出雾面玻璃效果 */
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(45deg, #12c2e9, #c471ed, #f64f59);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      padding: 20px;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* 雾面玻璃容器 */
    .glass-container {
      background: rgba(255, 255, 255, 0.15); /* 半透明白色 */
      backdrop-filter: blur(16px); /* 核心：模糊背景 */
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.3); /* 边缘高光 */
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 450px;
      color: #fff;
    }

    .glass-container h2 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 1px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }

    /* 表单元素样式 */
    .form-group {
      margin-bottom: 25px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 500;
    }

    .form-control {
      width: 100%;
      padding: 12px 15px;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 10px;
      color: #fff;
      font-size: 16px;
      outline: none;
      transition: all 0.3s ease;
    }

    .form-control::placeholder {
      color: rgba(255, 255, 255, 0.7);
    }

    .form-control:focus {
      background: rgba(255, 255, 255, 0.3);
      border-color: #fff;
      box-shadow: 0 0 10px rgba(255,255,255,0.2);
    }

    /* 下拉选单文字颜色处理（因为option在部分浏览器下会继承透明背景导致看不清） */
    select.form-control option {
      background: #c471ed; 
      color: #fff;
    }

    /* 按钮组布局 */
    .btn-group {
      display: flex;
      gap: 15px;
      margin-top: 10px;
    }

    /* 共用按钮样式 */
    .btn {
      flex: 1; /* 平分宽度 */
      padding: 14px;
      border-radius: 10px;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(5px);
      text-align: center;
      text-decoration: none;
    }

    /* 提交按钮 (打卡) */
    .submit-btn {
      background: rgba(255, 255, 255, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .submit-btn:hover {
      background: rgba(255, 255, 255, 0.4);
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .submit-btn:disabled {
      background: rgba(255, 255, 255, 0.1);
      cursor: not-allowed;
      transform: none;
    }

    /* 返回按钮 (Kembali) */
    .back-btn {
      background: rgba(0, 0, 0, 0.15); /* 稍微深色一点以作区分 */
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .back-btn:hover {
      background: rgba(0, 0, 0, 0.25);
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    /* 状态提示信息 */
    #statusMessage {
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
      min-height: 20px;
    }
  </style>
</head>
<body>

  <div class="glass-container">
    <h2>Sistem Kehadiran</h2>
    <form id="attendanceForm">
      
      <div class="form-group">
        <label for="namaLengkap">Nama Lengkap (姓名)</label>
        <input type="text" id="namaLengkap" class="form-control" placeholder="Masukkan nama anda" required>
      </div>

      <div class="form-group">
        <label for="sesiWaktu">Sesi (时段)</label>
        <select id="sesiWaktu" class="form-control" required>
          <option value="" disabled selected>Pilih Sesi...</option>
          <option value="Sesi Pagi">Sesi Pagi (上午)</option>
          <option value="Sesi Petang">Sesi Petang (下午)</option>
        </select>
      </div>

      <!-- 加入了 btn-group 容器来并排按钮 -->
      <div class="btn-group">
        <!-- 默认行为：回到上一页 -->
        <button type="button" class="btn back-btn" onclick="window.history.back()">Kembali (返回)</button>
        <button type="submit" class="btn submit-btn" id="submitBtn">Hantar (打卡)</button>
      </div>
      
      <div id="statusMessage"></div>
    </form>
  </div>

  <script type="module">
    import { insertData } from './db_helper.js';

    document.getElementById('attendanceForm').addEventListener('submit', async (e) => {
      e.preventDefault(); 

      const nama = document.getElementById('namaLengkap').value.trim();
      const sesi = document.getElementById('sesiWaktu').value;
      const submitBtn = document.getElementById('submitBtn');
      const statusMessage = document.getElementById('statusMessage');

      if (!nama || !sesi) {
        statusMessage.style.color = '#ffcccb';
        statusMessage.textContent = 'Sila isi semua maklumat.';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Menyimpan...';
      statusMessage.textContent = '';

      const now = new Date();
      const tarikh = now.toLocaleDateString('en-MY'); 
      const masa = now.toLocaleTimeString('en-MY', { hour12: true });

      const attendanceData = {
        nama: nama,
        sesi: sesi,
        tarikhFormat: tarikh,
        masaFormat: masa 
      };

      try {
        const docId = await insertData('rekod_kehadiran', attendanceData);
        
        statusMessage.style.color = '#d4edda';
        statusMessage.textContent = 'Kehadiran berjaya direkodkan!';
        
        document.getElementById('attendanceForm').reset();
      } catch (error) {
        console.error(error);
        statusMessage.style.color = '#ffcccb';
        statusMessage.textContent = 'Ralat sistem. Sila cuba lagi.';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Hantar (打卡)';
        
        setTimeout(() => {
          statusMessage.textContent = '';
        }, 3000);
      }
    });
  </script>
</body>
</html>
