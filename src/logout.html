<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Keluar - Sistem PSS</title>
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    h2 { margin-bottom: 10px; color: #38bdf8; }
    p { color: #cbd5e1; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Anda Telah Log Keluar</h2>
    <p>Sesi anda telah ditamatkan. Mengalih ke halaman utama...</p>
  </div>

  <script>
    // 1. 清除 session 状态
    sessionStorage.removeItem("user");
    sessionStorage.clear(); // 彻底清理 session

    // 2. 延迟 1.5 秒后跳转到 index.html
    setTimeout(() => {
      window.location.href = "index.html";
    }, 1500);
  </script>
</body>
</html>
