<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Keluar - Sistem PSS</title>
  <link rel="stylesheet" href="../style/logout.css">
  
  <!-- PERFORMANCE IMPROVEMENT: Prefetch the login page so it loads instantly in the background -->
  <link rel="prefetch" href="index.html">
</head>
<body>
  <div class="card">
    <h2>Anda Telah Log Keluar</h2>
    <p>Sesi anda telah ditamatkan. Mengalih ke halaman utama...</p>
  </div>

  <script>
    // 1. Clear session status and wipe sessionStorage completely
    sessionStorage.removeItem("user");
    sessionStorage.clear(); 

    // 2. Reduced delay to 800ms for a faster experience
    setTimeout(() => {
      // 3. Use location.replace() so users cannot click the "Back" button to return to the logout page
      window.location.replace("index.html");
    }, 800);
  </script>
</body>
</html>
