<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Keluar - Sistem PSS</title>
  <link rel="stylesheet" href="../style/logout.css">
</head>
<body>
  <div class="card">
    <h2>Anda Telah Log Keluar</h2>
    <p>Sesi anda telah ditamatkan. Mengalih ke halaman utama...</p>
  </div>

  <script>
    // 1. 清除 session 状态
    sessionStorage.removeItem("user");
    sessionStorage.clear(); // 彻底清理 session

    // 2. 延迟 1.5 秒后跳转到 index.html
    setTimeout(() => {
      window.location.href = "index.html";
    }, 1500);
  </script>
</body>
</html>
