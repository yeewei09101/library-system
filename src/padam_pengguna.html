<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padam Pengguna</title>
    <style>
        /* 全局背景：使用渐变色彩来突显雾面玻璃效果 */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
        }

        /* 雾面玻璃容器 */
        .glass-container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 40px;
            width: 90%;
            max-width: 900px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            overflow-x: auto;
        }

        h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        /* 表格设计 */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        th {
            background-color: rgba(255, 255, 255, 0.1);
            font-weight: 600;
            letter-spacing: 1px;
        }

        tr:hover {
            background-color: rgba(255, 255, 255, 0.08);
            transition: background-color 0.3s;
        }

        /* 删除按钮设计 */
        .btn-delete {
            background: rgba(255, 77, 77, 0.85);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn-delete:hover {
            background: rgba(255, 50, 50, 1);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }

        .btn-delete:disabled {
            background: rgba(150, 150, 150, 0.5);
            cursor: not-allowed;
            transform: none;
        }

        .message-row {
            text-align: center;
            padding: 20px;
            font-style: italic;
            color: rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body>

    <div class="glass-container">
        <h2>Senarai Pengguna (Padam)</h2>
        
        <table>
            <thead>
                <tr>
                    <th>Nama</th>
                    <th>Emel</th>
                    <th>Peranan (Role)</th>
                    <th>Tindakan</th>
                </tr>
            </thead>
            <tbody id="userTableBody">
                <tr>
                    <td colspan="4" class="message-row">Memuatkan data dari pangkalan data...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- 必须使用 type="module" 因为我们使用了 import -->
    <script type="module">
        // 引入你的 db_helper.js 里的读取和删除功能
        import { readAllData, deleteData } from './db_helper.js';

        // 设定你要读取/操作的 Firebase Collection 名称 (依据你数据库的设定修改)
        const COLLECTION_NAME = 'pengguna'; 
        const tbody = document.getElementById('userTableBody');

        // 1. 获取并显示用户列表的函数
        async function loadUsers() {
            try {
                // 调用 db_helper 的 readAllData
                const users = await readAllData(COLLECTION_NAME, 'createdAt', 'desc');
                tbody.innerHTML = ''; // 清空"加载中"的文字

                if (users.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="message-row">Tiada pengguna dijumpai.</td></tr>';
                    return;
                }

                // 循环渲染用户数据
                users.forEach(user => {
                    const tr = document.createElement('tr');
                    
                    // 兼容多种常见的栏位命名 (nama/name, emel/email, peranan/role)
                    const nama = user.nama || user.name || '-';
                    const emel = user.emel || user.email || '-';
                    const peranan = user.peranan || user.role || '-';

                    tr.innerHTML = `
                        <td>${nama}</td>
                        <td>${emel}</td>
                        <td>${peranan}</td>
                        <td>
                            <button class="btn-delete" data-id="${user.id}">Padam</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });

                // 为所有生成的“Padam”按钮绑定点击事件
                document.querySelectorAll('.btn-delete').forEach(button => {
                    button.addEventListener('click', handleDelete);
                });

            } catch (error) {
                console.error("Ralat memuatkan pengguna:", error);
                tbody.innerHTML = '<tr><td colspan="4" class="message-row" style="color:#ffb3b3;">Gagal memuatkan data. Sila semak console.</td></tr>';
            }
        }

        // 2. 处理删除逻辑的函数
        async function handleDelete(event) {
            const button = event.target;
            const userId = button.getAttribute('data-id');
            
            // 弹出原生的二次确认视窗
            const confirmDelete = confirm("Adakah anda pasti mahu memadam pengguna ini? Tindakan ini tidak boleh dibatalkan.");

            if (confirmDelete) {
                try {
                    // 改变按钮状态，防止重复点击
                    button.innerText = "Memadam...";
                    button.disabled = true;

                    // 调用 db_helper 的 deleteData
                    await deleteData(COLLECTION_NAME, userId);
                    alert("Pengguna berjaya dipadam!");
                    
                    // 删除成功后，重新加载表格刷新画面
                    loadUsers();
                } catch (error) {
                    console.error("Ralat memadam pengguna:", error);
                    alert("Gagal memadam pengguna.");
                    
                    // 如果失败，恢复按钮状态
                    button.innerText = "Padam";
                    button.disabled = false;
                }
            }
        }

        // 3. 页面加载完毕后自动运行
        window.addEventListener('DOMContentLoaded', loadUsers);
    </script>
</body>
</html>
