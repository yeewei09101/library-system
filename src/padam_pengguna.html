<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padam Pengguna</title>
    <style>
        /* 全局背景：使用渐变色彩来突显雾面玻璃效果 */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
        }

        /* 雾面玻璃容器 */
        .glass-container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 40px;
            width: 90%;
            max-width: 900px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            overflow-x: auto;
        }

        h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        /* 表格设计 */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        th {
            background-color: rgba(255, 255, 255, 0.1);
            font-weight: 600;
            letter-spacing: 1px;
        }

        tr:hover {
            background-color: rgba(255, 255, 255, 0.08);
            transition: background-color 0.3s;
        }

        /* 删除按钮设计 */
        .btn-delete {
            background: rgba(255, 77, 77, 0.85);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn-delete:hover {
            background: rgba(255, 50, 50, 1);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }

        .btn-delete:disabled {
            background: rgba(150, 150, 150, 0.5);
            cursor: not-allowed;
            transform: none;
        }

        .message-row {
            text-align: center;
            padding: 20px;
            font-style: italic;
            color: rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body>

    <div class="glass-container">
        </div>
         <button onclick="window.location.href='admin.html'" class="glass-card glass-btn px-4 py-2 rounded-lg text-sm font-semibold cursor-pointer flex items-center gap-2">
                        <span>⬅</span> Kembali
                    </button>
        <h2>Senarai Pengguna (Padam)</h2>
        
        <table>
            <thead>
                <tr>
                    <!-- 配合你 Firebase 的栏位 -->
                    <th>ID Pengguna</th>
                    <th>Nama</th>
                    <th>Peranan (Role)</th>
                    <th>Sesi</th>
                    <th>Tindakan</th>
                </tr>
            </thead>
            <tbody id="userTableBody">
                <tr>
                    <td colspan="5" class="message-row">Memuatkan data dari pangkalan data...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- 注意: 确保路径是 db_helper.js 还是 db-helper.js -->
    <script type="module">
        import { readAllData, deleteData } from './db-helper.js';

        const tbody = document.getElementById('userTableBody');

        // 1. 获取并显示用户列表的函数
        async function loadUsers() {
            try {
                tbody.innerHTML = '<tr><td colspan="5" class="message-row">Memuatkan data dari pangkalan data...</td></tr>';
                
                // 【核心修改】：同时从 "users" 和 "admin" 两个集合读取数据，因为你添加时是分开存的
                const usersData = await readAllData('users');
                const adminData = await readAllData('admin');
                // 将两边的数据合并，并加上 _collection 标签，方便删除时知道去哪个集合删
                const allData = [
                    ...usersData.map(u => ({ ...u, _collection: 'users' })),
                    ...adminData.map(a => ({ ...a, _collection: 'admin' }))
                ];

                tbody.innerHTML = ''; 

                if (allData.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="message-row">Tiada pengguna dijumpai.</td></tr>';
                    return;
                }

                // 循环渲染用户数据
                allData.forEach(user => {
                    const tr = document.createElement('tr');
                    
                    // 对应 tambah pengguna 表单里的变量名
                    const id = user.id_pengguna || user.id_admin || '-';
                    const nama = user.nama || '-';
                    const peranan = user.role || '-';
                    const sesi = user.sesi || '-';

                    tr.innerHTML = `
                        <td>${id}</td>
                        <td>${nama}</td>
                        <td style="text-transform: capitalize;">${peranan}</td>
                        <td style="text-transform: capitalize;">${sesi}</td>
                        <td>
                            <!-- 绑定 Firebase ID 和 所在的 Collection -->
                            <button class="btn-delete" data-id="${user.id}" data-collection="${user._collection}">Padam</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });

                // 为所有生成的“Padam”按钮绑定点击事件
                document.querySelectorAll('.btn-delete').forEach(button => {
                    button.addEventListener('click', handleDelete);
                });

            } catch (error) {
                console.error("Ralat memuatkan pengguna:", error);
                tbody.innerHTML = '<tr><td colspan="5" class="message-row" style="color:#ffb3b3;">Gagal memuatkan data. Sila semak console.</td></tr>';
            }
        }

        // 2. 处理删除逻辑的函数
        async function handleDelete(event) {
            const button = event.target;
            const docId = button.getAttribute('data-id'); // Firebase Document ID
            const collectionName = button.getAttribute('data-collection'); // 'users' 或 'admin'
            
            const confirmDelete = confirm("Adakah anda pasti mahu memadam pengguna ini? Tindakan ini tidak boleh dibatalkan.");

            if (confirmDelete) {
                try {
                    button.innerText = "Memadam...";
                    button.disabled = true;

                    // 根据该用户所在的集合进行删除
                    await deleteData(collectionName, docId);
                    alert(`Pengguna berjaya dipadam dari koleksi [${collectionName}]!`);
                    
                    // 重新加载表格
                    loadUsers();
                } catch (error) {
                    console.error("Ralat memadam pengguna:", error);
                    alert("Gagal memadam pengguna.");
                    
                    button.innerText = "Padam";
                    button.disabled = false;
                }
            }
        }

        // 3. 页面加载完毕后自动运行
        window.addEventListener('DOMContentLoaded', loadUsers);
    </script>
</body>
</html>
