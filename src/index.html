<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Masuk - PSS System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* 替换为你的背景图 */
            background: url('../img/background.jpg') no-repeat center center/cover;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
        }

        .login-card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .image-container {
            width: 90px;
            height: 90px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            border: 3px solid #fff;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .login-card h2 {
            color: #333;
            margin-bottom: 24px;
            font-size: 1.5rem;
            font-weight: 600;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: #4A90E2;
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.2);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #4A90E2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: #357ABD;
        }

        .btn-submit:disabled {
            background: #a0c4e2;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="image-container">
            <img src="../img/logo.jpg" alt="Logo PSS">
        </div>

        <h2>Sistem Log Masuk PSS</h2>

        <form id="loginForm">
            <div class="input-group">
                <label for="id_pengguna">ID Pengguna</label>
                <input type="text" id="id_pengguna" placeholder="Masukkan ID Pengguna" required>
            </div>

            <div class="input-group">
                <label for="kata_laluan">Kata Laluan</label>
                <input type="password" id="kata_laluan" placeholder="Masukkan Kata Laluan" required>
            </div>

            <button type="submit" id="loginBtn" class="btn-submit">Log Masuk</button>
        </form>
    </div>

    <!-- Proses Login JS -->
    <script type="module">
        import { db } from './firebase.js';
        import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault(); // 阻止表单默认提交刷新

            const idPengguna = document.getElementById('id_pengguna').value.trim();
            const kataLaluan = document.getElementById('kata_laluan').value.trim();

            if (!idPengguna || !kataLaluan) {
                alert("Sila isi ID Pengguna dan Kata Laluan!");
                return;
            }

            // 改变按钮状态为加载中
            loginBtn.disabled = true;
            loginBtn.textContent = "Sedang diproses...";

            try {
                // 1. 查询 Firestore 中名为 'users' 的 Collection
                const usersRef = collection(db, "users");
                const q = query(usersRef, where("id_pengguna", "==", idPengguna));
                const querySnapshot = await getDocs(q);

                // 2. 检查用户是否存在
                if (querySnapshot.empty) {
                    alert("ID Pengguna tidak dijumpai!");
                    resetButton();
                    return;
                }

                // 3. 验证密码 (假设每个 ID 是唯一的)
                let isAuthenticated = false;
                let userData = null;

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    if (data.kata_laluan === kataLaluan) {
                        isAuthenticated = true;
                        userData = data;
                    }
                });

                if (isAuthenticated) {
                    alert("Log masuk berjaya!");
                    
                    // 将登录用户资料暂存到 SessionStorage (供主页使用)
                    sessionStorage.setItem("user", JSON.stringify(userData));

                    // 跳转至系统主页 (根据需要修改为你的文件名，例如 index.html)
                    window.location.href = "utama.html";
                } else {
                    alert("Kata laluan salah!");
                    resetButton();
                }

            } catch (error) {
                console.error("Ralat log masuk: ", error);
                alert("Ralat semasa log masuk! Sila cuba lagi.");
                resetButton();
            }
        });

        function resetButton() {
            loginBtn.disabled = false;
            loginBtn.textContent = "Log Masuk";
        }
    </script>
</body>
</html>
