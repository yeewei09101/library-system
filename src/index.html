<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Masuk - PSS System</title>
    <!-- Link Style CSS -->
    <link rel="stylesheet" href="../style/style.css">
</head>
<body>

    <div class="login-card">
        <div class="image-container">
            <img src="../img/logo.jpg" alt="Logo PSS">
        </div>

        <h2>Sistem Log Masuk PSS</h2>

        <form id="loginForm">
            <div class="input-group">
                <label for="id_pengguna">ID Pengguna/ID Admin</label>
                <input type="text" id="id_pengguna" placeholder="Masukkan ID Pengguna" required>
            </div>

            <div class="input-group">
                <label for="password">Kata Laluan</label>
                <input type="password" id="password" placeholder="Masukkan Kata Laluan" required>
            </div>

            <button type="submit" id="loginBtn" class="btn-submit">Log Masuk</button>
        </form>
    </div>

    <!-- Login Process JS -->
    <script type="module">
        import { queryData } from './db-helper.js';

        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault(); 

            // Get the input values
            const idPengguna = document.getElementById('id_pengguna').value.trim();
            const kataLaluanInput = document.getElementById('password').value.trim();

            if (!idPengguna || !kataLaluanInput) {
                alert("Sila isi ID Pengguna dan Kata Laluan!");
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = "Sedang diproses...";

            try {
                let userRole = null;
                let userData = null;

                // PERFORMANCE IMPROVEMENT: 
                // Fetch admin and user data concurrently using Promise.all to reduce waiting time.
                const [adminList, userList] = await Promise.all([
                    queryData("admin", "id_admin", "==", idPengguna),
                    queryData("users", "id_pengguna", "==", idPengguna)
                ]);

                // 1. Check if the user exists in the admin list and verify password
                const matchedAdmin = adminList.find(admin => admin.password === kataLaluanInput);

                if (matchedAdmin) {
                    userRole = "admin";
                    userData = matchedAdmin;
                } else {
                    // 2. If not admin, check if the user exists in the users list and verify password
                    const matchedUser = userList.find(user => user.password === kataLaluanInput);

                    if (matchedUser) {
                        userRole = "user";
                        userData = matchedUser;
                    }
                }

                // 3. Validation successful
                if (userData) {
                    alert(`Log masuk berjaya! (${userRole === 'admin' ? 'Admin' : 'Pengguna'})`);
                    
                    userData.role = userRole;
                    sessionStorage.setItem("user", JSON.stringify(userData));

                    // Redirect based on role
                    if (userRole === "admin") {
                        window.location.href = "admin.html";
                    } else {
                        window.location.href = "utama.html";
                    }
                } else {
                    alert("ID Pengguna atau Kata Laluan salah!");
                    resetButton();
                }

            } catch (error) {
                console.error("Ralat log masuk: ", error);
                alert("Ralat semasa log masuk! Sila cuba lagi.");
                resetButton();
            }
        });

        function resetButton() {
            loginBtn.disabled = false;
            loginBtn.textContent = "Log Masuk";
        }
    </script>
</body>
</html>
