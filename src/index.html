<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Masuk - PSS System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                background: url('../img/background.jpg') no-repeat center center/cover;
                position: relative;
        }

        /* Overlay untuk menjadikan borang lebih jelas di atas latar belakang */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
        }

        .login-card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        /* Tempat Gambar Hiasan / Logo (.jpg) */
        .image-container {
            width: 90px;
            height: 90px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            border: 3px solid #fff;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .login-card h2 {
            color: #333;
            margin-bottom: 24px;
            font-size: 1.5rem;
            font-weight: 600;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: #4A90E2;
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.2);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #4A90E2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: #357ABD;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- Gambar Hiasan / Logo (.jpg) -->
        <div class="image-container">
            <img src="../img/logo.jpg" alt="Logo PSS">
        </div>

        <h2>Sistem Log Masuk PSS</h2>

        <form id="loginForm">
            <div class="input-group">
                <label for="id_pengguna">ID Pengguna</label>
                <input type="text" id="id_pengguna" placeholder="Masukkan ID Pengguna" required>
            </div>

            <div class="input-group">
                <label for="kata_laluan">Kata Laluan</label>
                <input type="password" id="kata_laluan" placeholder="Masukkan Kata Laluan" required>
            </div>

            <button type="submit" class="btn-submit">Log Masuk</button>
        </form>
    </div>

</body>
</html>
