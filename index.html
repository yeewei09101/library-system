<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图书管理报告系统</title>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        /* 表单样式 */
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; }
        .form-group input, .form-group textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        
        /* 报告卡片样式 */
        .report-item { border-left: 4px solid #1a5f7a; background: #f8fafc; padding: 12px; margin-bottom: 12px; }
        
        /* 关键：保留管理员输入的换行符（Enter 回车） */
        .report-content { white-space: pre-wrap; word-break: break-word; }
        .meta { font-size: 0.85em; color: #666; margin-bottom: 8px; }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. 管理员填写区 -->
    <div class="card">
        <h2>✍️ 提交图书管理报告</h2>
        <form id="reportForm">
            <div class="form-group">
                <label>管理员姓名</label>
                <input type="text" id="reporter" required placeholder="如：小明">
            </div>
            <div class="form-group">
                <label>报告标题</label>
                <input type="text" id="title" required placeholder="如：8月1日图书损耗统计">
            </div>
            <div class="form-group">
                <label>报告/Komen 详情</label>
                <textarea id="content" rows="4" required placeholder="填写详细内容..."></textarea>
            </div>
            <button type="submit" id="submitBtn">🚀 提交</button>
        </form>
    </div>

    <!-- 2. 老师查阅区 -->
    <div class="card">
        <h2>📋 历史报告记录</h2>
        <!-- 准备一个空容器，靠 JS 把数据填进来 -->
        <div id="reportList">加载中...</div>
    </div>
</div>

<script>
    // 🔗 替换为你拿到的 Web App URL
    const API_URL = "YOUR_WEB_APP_URL_HERE";

    // 页面加载完成后，立刻去获取历史报告
    loadReports();

    // ==========================================
    // 逻辑 1：用 fetch() 读取数据 (GET)
    // ==========================================
    function loadReports() {
        fetch(API_URL)
            .then(response => response.json()) // 把返回的字符串转成 JSON 数组
            .then(data => {
                const list = document.getElementById('reportList');
                
                if (data.length === 0) {
                    list.innerHTML = "<p>暂无报告记录。</p>";
                    return;
                }

                // 用 map 遍历数组，拼成 HTML 字符串
                list.innerHTML = data.map(item => `
                    <div class="report-item">
                        <h3>${escapeHtml(item.title)}</h3>
                        <div class="meta">提交人：${escapeHtml(item.reporter)} | 时间：${item.timestamp}</div>
                        <div class="report-content">${escapeHtml(item.content)}</div>
                    </div>
                `).join('');
            })
            .catch(error => {
                document.getElementById('reportList').innerHTML = "<p style='color:red;'>加载失败，请检查网络或 API URL。</p>";
            });
    }

    // ==========================================
    // 逻辑 2：用 fetch() 提交数据 (POST)
    // ==========================================
    document.getElementById('reportForm').addEventListener('submit', function(e) {
        // 关键！阻止表单默认的刷新/跳转行为
        e.preventDefault();

        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = "提交中...";

        // 收集输入框的值
        const payload = {
            idkum: document.getElementById('idkum').value,
            time: document.getElementById('time').value,
            komen: document.getElementById('komen').value
        };

        // 发送 POST 请求
        fetch(API_URL, {
            method: "POST",
            body: JSON.stringify(payload) // 必须转成 JSON 字符串发给后端
        })
        .then(response => response.json())
        .then(result => {
            alert("提交成功！");
            document.getElementById('reportForm').reset(); // 清空输入框
            loadReports(); // 重新加载报告列表，刷新最新提交的内容
        })
        .catch(error => {
            alert("提交失败，请重试！");
        })
        .finally(() => {
            btn.disabled = false;
            btn.innerText = "🚀 提交";
        });
    });

    // 辅助函数：过滤 HTML 标签，防止用户输入的符号导致页面报错
    function escapeHtml(str) {
        return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
    }
</script>

</body>
</html>
